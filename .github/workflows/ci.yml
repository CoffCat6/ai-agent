name: CI

# 发布流水线：三个 job 全部只做「构建 + 部署产物」，测试已从 CI 剥离
# （用户决策 2026-11-10：runner 环境差异导致的测试问题不阻塞发布；
# 本地 ctest 与 tests/ 基础设施完整保留）。
#
# 普通 push / PR：只跑构建，产物进 CI artifact 页（90 天过期）。
# 推送 v* 版本标签：额外触发 release job，把 Release 配置的 win64 zip
# 与 Linux AppImage 发到 GitHub Releases（gh release create）。
#
# Windows：aqt 安装 Qt 6.9 MinGW + deploy.ps1（自包含目录 + zip 产物）。
# Linux：aqt 安装 Qt 6.9 gcc_64 + deploy.sh（AppDir + AppImage 产物）。
#
# 环境要点（bring-up 期间实测踩坑，勿回退）：
#   - aqt 参数是 --outputdir（无连字符）；CLI 架构令牌与磁盘目录名不同：
#     Windows 令牌 win64_mingw 装到 mingw_64/，Linux 令牌 linux_gcc_64
#     装到 gcc_64/——CMAKE_PREFIX_PATH 必须用目录名。
#   - PS 5.1 写 GITHUB_ENV 必须用 Add-Content（Out-File 默认 UTF-16，
#     runner 解析不出，CMAKE_PREFIX_PATH 会静默丢失）。

on:
  push:
  pull_request:

jobs:
  # ── Windows：debug（构建验证）与 release（发版资产）──
  #
  # 两个 job 的「装 Qt + 定位 MinGW」完全共用 .github/actions/setup-qt-mingw
  # （原先各写 28 行，改 Qt 版本要同步改两处，极易漂移）。
  #
  # 为什么拆成两个 job 而不是一个 matrix：release 那份只需在版本标签上跑
  # （普通 push 省掉一次全量 Windows 构建——装 Qt 6.9 + MinGW + 编译 +
  # windeployqt 并不便宜），而 job 级 if 里拿不到 matrix 上下文，matrix 的
  # include 条目也不支持条件。拆开后两件事各自表达清楚。
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-mingw

      - name: Configure
        shell: pwsh
        run: cmake -B build -G Ninja

      - name: Build
        shell: pwsh
        run: cmake --build build

      # Debug profile 只产 deploy/ 目录，供 CI artifact 页取用；
      # 不发 Release（发版资产由下面的 release job 负责）。
      - name: Deploy
        shell: pwsh
        run: ./scripts/deploy.ps1 -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-deploy
          path: deploy/

  windows-mingw-release:
    # 仅版本标签：普通 push/PR 不必为发版资产多跑一次全量构建。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-qt-mingw

      - name: Configure (Release)
        shell: pwsh
        run: cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build-release

      # -Zip 在仓库根产出 NexusAI-<version>-win64.zip（发布资产之一）；
      # deploy-release/ 目录保留给 Inno Setup 作安装包源。
      - name: Deploy (Release)
        shell: pwsh
        run: ./scripts/deploy.ps1 -BuildDir build-release -OutDir deploy-release -Zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # 安装包（setup.exe）：assets/windows/nexusai.iss，版本号与部署目录
      # 用 /D 注入（.iss 内路径按脚本位置解析，这里传绝对路径）。
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern '^project\(\s*NexusAI\s+VERSION\s+([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DDeployDir=$env:GITHUB_WORKSPACE/deploy-release" `
            "/DOutputDir=$env:GITHUB_WORKSPACE" `
            "assets/windows/nexusai.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-release-deploy
          path: |
            NexusAI-*-win64.zip
            NexusAI-*-setup.exe

  # Linux：构建 + AppImage（docs/49 阶段 1）。NEXUS_LINUX_APPIMAGE=ON 让
  # install 规则挂载 Qt deploy 脚本，deploy.sh 的 cmake --install 把 Qt
  # 运行时捆绑进 AppDir 后由 appimagetool 封装。
  linux-gcc:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 构建期依赖：*-mesa-dev/libxkbcommon-dev 供 find_package(Qt6 Gui→
      # WrapOpenGL) 通过；qtkeychain-qt6-dev 供 nexus_viewmodels 编译
      # （docs/49 D1）；patchelf/squashfs-tools 供 deploy.sh 的 rpath 改写
      # 与 AppImage 封装；rpm 供 package-linux.sh 的 rpmbuild；其余运行时
      # 库是构建期 Qt 工具（qmlcachegen 等）的动态依赖。
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            qtkeychain-qt6-dev patchelf squashfs-tools rpm

      - name: Cache Qt (linux_gcc_64) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-linuxgcc64-qtpdf-v1

      - name: Install Qt (linux_gcc_64) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -m qtpdf --outputdir $QT_DIR

      - name: Configure
        run: cmake -B build -G Ninja -DNEXUS_LINUX_APPIMAGE=ON -DCMAKE_PREFIX_PATH=$QT_DIR/$QT_VERSION/gcc_64

      - name: Build
        run: cmake --build build

      - name: Deploy (AppImage)
        run: ./scripts/deploy.sh -BuildDir build -OutDir deploy

      # deb/rpm 与 AppImage 同源（deploy.sh 留下的 AppDir）：应用本体
      # /opt/NexusAI + /usr/bin 符号链接 + /usr/share 桌面集成。
      - name: Package (deb/rpm)
        run: ./scripts/package-linux.sh -AppDir deploy/AppDir -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-linux64-appimage
          path: NexusAI-*-linux64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-linux-deb-rpm
          path: |
            deploy/*.deb
            deploy/*.rpm

  # 发布：仅版本标签（v*）触发——普通 push 只跑构建，打 tag 才发 Release。
  # 资产 = win64 安装包 + win64 zip + Linux AppImage/deb/rpm；debug 配置的
  # Windows job 产物留在 CI artifact 页，不进 Release。
  #
  # needs 里保留 windows-mingw（debug）是有意的：它充当发版前的额外编译
  # 门禁——同一个 tag 上 debug 编译不过时，不应该把 release 资产发出去。
  # 代价是该 tag 会跑两次 Windows 构建（debug + release），这是有意识的取舍。
  #
  # 约束：本 job 的 if 必须与 windows-mingw-release 的 if **字面一致**。
  # needs 里的 job 被跳过时，依赖它的 job 也会被跳过；两者条件一致，所以
  # tag 场景下 windows-mingw-release 一定会跑，本 job 不会被连带跳过。
  # 若要放宽本 job 的触发条件，必须同时放宽上面那个 job。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-mingw, windows-mingw-release, linux-gcc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/nexusai-win64-release-deploy/NexusAI-*-setup.exe release/
          cp artifacts/nexusai-win64-release-deploy/NexusAI-*-win64.zip release/
          cp artifacts/nexusai-linux64-appimage/*.AppImage release/
          cp artifacts/nexusai-linux-deb-rpm/*.deb release/
          cp artifacts/nexusai-linux-deb-rpm/*.rpm release/
          ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "NexusAI $GITHUB_REF_NAME" \
            --generate-notes
