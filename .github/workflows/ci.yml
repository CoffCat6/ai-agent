name: CI

# 发布流水线：三个 job 全部只做「构建 + 部署产物」，测试已从 CI 剥离
# （用户决策 2026-11-10：runner 环境差异导致的测试问题不阻塞发布；
# 本地 ctest 与 tests/ 基础设施完整保留）。
#
# Windows：aqt 安装 Qt 6.9 MinGW + deploy.ps1（自包含目录 + zip 产物）。
# Linux：aqt 安装 Qt 6.9 gcc_64 + deploy.sh（AppDir + AppImage 产物）。
#
# 环境要点（bring-up 期间实测踩坑，勿回退）：
#   - aqt 参数是 --outputdir（无连字符）；CLI 架构令牌与磁盘目录名不同：
#     Windows 令牌 win64_mingw 装到 mingw_64/，Linux 令牌 linux_gcc_64
#     装到 gcc_64/——CMAKE_PREFIX_PATH 必须用目录名。
#   - PS 5.1 写 GITHUB_ENV 必须用 Add-Content（Out-File 默认 UTF-16，
#     runner 解析不出，CMAKE_PREFIX_PATH 会静默丢失）。

on:
  push:
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Qt (MinGW) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-mingw1310-qtpdf-v1

      - name: Install Qt (MinGW) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt windows desktop $env:QT_VERSION win64_mingw -m qtpdf --outputdir $env:QT_DIR
          # MinGW 13.1 toolchain bundled by Qt (same as the local dev setup)
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $env:QT_DIR

      - name: Locate MinGW toolchain
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "$env:QT_DIR/Tools" -Recurse -Filter "g++.exe" | Select-Object -First 1
          if (-not $gpp) { throw "MinGW g++.exe not found under Qt/Tools" }
          # Add-Content 写 ASCII：PS 5.1 的 Out-File 默认 UTF-16 会让
          # GITHUB_ENV/GITHUB_PATH 解析失败（bring-up 实测）。
          Add-Content $env:GITHUB_PATH "$($gpp.DirectoryName)"
          Add-Content $env:GITHUB_PATH "$env:QT_DIR/$env:QT_VERSION/mingw_64/bin"
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$env:QT_DIR/$env:QT_VERSION/mingw_64"

      - name: Configure
        shell: pwsh
        run: cmake -B build -G Ninja

      - name: Build
        shell: pwsh
        run: cmake --build build

      - name: Deploy
        shell: pwsh
        run: ./scripts/deploy.ps1 -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-deploy
          path: deploy/

  windows-mingw-release:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Qt (MinGW) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-mingw1310-qtpdf-v1

      - name: Install Qt (MinGW) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt windows desktop $env:QT_VERSION win64_mingw -m qtpdf --outputdir $env:QT_DIR
          # MinGW 13.1 toolchain bundled by Qt (same as the local dev setup)
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $env:QT_DIR

      - name: Locate MinGW toolchain
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "$env:QT_DIR/Tools" -Recurse -Filter "g++.exe" | Select-Object -First 1
          if (-not $gpp) { throw "MinGW g++.exe not found under Qt/Tools" }
          Add-Content $env:GITHUB_PATH "$($gpp.DirectoryName)"
          Add-Content $env:GITHUB_PATH "$env:QT_DIR/$env:QT_VERSION/mingw_64/bin"
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$env:QT_DIR/$env:QT_VERSION/mingw_64"

      - name: Configure (Release)
        shell: pwsh
        run: cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build-release

      - name: Deploy (Release)
        shell: pwsh
        run: ./scripts/deploy.ps1 -BuildDir build-release -OutDir deploy-release

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-release-deploy
          path: deploy-release/

  # Linux：构建 + AppImage（docs/49 阶段 1）。NEXUS_LINUX_APPIMAGE=ON 让
  # install 规则挂载 Qt deploy 脚本，deploy.sh 的 cmake --install 把 Qt
  # 运行时捆绑进 AppDir 后由 appimagetool 封装。
  linux-gcc:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 构建期依赖：*-mesa-dev/libxkbcommon-dev 供 find_package(Qt6 Gui→
      # WrapOpenGL) 通过；qtkeychain-qt6-dev 供 nexus_viewmodels 编译
      # （docs/49 D1）；patchelf/squashfs-tools 供 deploy.sh 的 rpath 改写
      # 与 AppImage 封装；其余运行时库是构建期 Qt 工具（qmlcachegen 等）
      # 的动态依赖。
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            qtkeychain-qt6-dev patchelf squashfs-tools

      - name: Cache Qt (linux_gcc_64) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-linuxgcc64-qtpdf-v1

      - name: Install Qt (linux_gcc_64) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -m qtpdf --outputdir $QT_DIR

      - name: Configure
        run: cmake -B build -G Ninja -DNEXUS_LINUX_APPIMAGE=ON -DCMAKE_PREFIX_PATH=$QT_DIR/$QT_VERSION/gcc_64

      - name: Build
        run: cmake --build build

      - name: Deploy (AppImage)
        run: ./scripts/deploy.sh -BuildDir build -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-linux64-appimage
          path: NexusAI-*-linux64.AppImage
