name: CI

# Batch 21 (G7): one-click Windows build + regression + deployment artifact.
# NOTE: this repo currently has no remote - the workflow activates once the
# repository is pushed to GitHub (see README "Build / Deployment / CI").
#
# B6-2: a second, Release-configured job reuses the same aqtinstall cache as
# the existing (default-configured) job. Both jobs install Qt 6.9 MinGW into
# ${{ github.workspace }}/Qt; the cache key is identical, so whichever job
# runs second restores the download instead of fetching it again.

on:
  push:
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Qt (MinGW) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-mingw1310-qtpdf-v1

      - name: Install Qt (MinGW) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt windows desktop $env:QT_VERSION win64_mingw -m qtpdf --outputdir $env:QT_DIR
          # MinGW 13.1 toolchain bundled by Qt (same as the local dev setup)
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $env:QT_DIR

      - name: Locate MinGW toolchain
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "$env:QT_DIR/Tools" -Recurse -Filter "g++.exe" | Select-Object -First 1
          if (-not $gpp) { throw "MinGW g++.exe not found under Qt/Tools" }
          Add-Content $env:GITHUB_PATH "$($gpp.DirectoryName)"
          Add-Content $env:GITHUB_PATH "$env:QT_DIR/$env:QT_VERSION/mingw_64/bin"
          # PS 5.1 的 Out-File 默认 UTF-16 编码，runner 的 GITHUB_ENV 解析器
          # 读不出该文件 → CMAKE_PREFIX_PATH 静默丢失（find_package Qt6 失败）。
          # 与上面 PATH 行同用 Add-Content（ASCII）才是 runner 能解析的格式。
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$env:QT_DIR/$env:QT_VERSION/mingw_64"

      - name: Configure
        shell: pwsh
        run: cmake -B build -G Ninja -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build

      # run4 实测：runner 上个别测试无输出即死（loader 级），--output-on-failure
      # 拿不到任何信息。失败时直接重跑失败子集的 exe 并打印退出码
      # （0xC0000135 = -1073741515 = 缺 DLL）与原始输出。
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Write-Host "== diagnostics: direct rerun of failing exes =="
          foreach ($name in @("test_sandbox", "test_viewmodel", "test_agent")) {
            $exe = Join-Path "build" "$name.exe"
            if (-not (Test-Path $exe)) { continue }
            $p = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput "$name.out.txt" -RedirectStandardError "$name.err.txt"
            Write-Host "$name exit=$($p.ExitCode) (0xC0000135 = -1073741515)"
            Get-Content "$name.out.txt" -ErrorAction SilentlyContinue | Select-Object -First 30
            Get-Content "$name.err.txt" -ErrorAction SilentlyContinue | Select-Object -First 30
          }
          exit $LASTEXITCODE

      - name: Deploy
        shell: pwsh
        run: ./scripts/deploy.ps1 -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-deploy
          path: deploy/

  windows-mingw-release:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Qt (MinGW) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-mingw1310-qtpdf-v1

      - name: Install Qt (MinGW) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt windows desktop $env:QT_VERSION win64_mingw -m qtpdf --outputdir $env:QT_DIR
          # MinGW 13.1 toolchain bundled by Qt (same as the local dev setup)
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir $env:QT_DIR

      - name: Locate MinGW toolchain
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "$env:QT_DIR/Tools" -Recurse -Filter "g++.exe" | Select-Object -First 1
          if (-not $gpp) { throw "MinGW g++.exe not found under Qt/Tools" }
          Add-Content $env:GITHUB_PATH "$($gpp.DirectoryName)"
          Add-Content $env:GITHUB_PATH "$env:QT_DIR/$env:QT_VERSION/mingw_64/bin"
          # PS 5.1 的 Out-File 默认 UTF-16 编码，runner 的 GITHUB_ENV 解析器
          # 读不出该文件 → CMAKE_PREFIX_PATH 静默丢失（find_package Qt6 失败）。
          # 与上面 PATH 行同用 Add-Content（ASCII）才是 runner 能解析的格式。
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$env:QT_DIR/$env:QT_VERSION/mingw_64"

      - name: Configure (Release)
        shell: pwsh
        run: cmake -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build-release

      - name: Test (Release)
        shell: pwsh
        run: ctest --test-dir build-release --output-on-failure

      - name: Deploy (Release)
        shell: pwsh
        run: ./scripts/deploy.ps1 -BuildDir build-release -OutDir deploy-release

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-win64-release-deploy
          path: deploy-release/

  # docs/49 阶段 0：Linux 编译 + 测试基线。linux_gcc_64 + qtpdf，offscreen 跑
  # 全量 ctest（Qt 运行时解析/无显示器适配在 tests/CMakeLists.txt 内按平台处理）。
  # 注意：aqt 的 CLI 架构令牌（6.7+ 为 linux_gcc_64）与磁盘安装目录名
  # （始终是 gcc_64；Windows 同理：令牌 win64_mingw / 目录 mingw_64）不同，
  # CMAKE_PREFIX_PATH 必须指向目录名。
  linux-gcc:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.9.0
      QT_DIR: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # offscreen 测试的运行时依赖：runner 预装大部分，显式补齐最小集。
      # patchelf: Qt deploy 脚本在 Linux 改写 rpath 的硬依赖（docs/49 阶段 1）
      # qtkeychain-qt6-dev: docs/49 D1 凭据加密（find_package(Qt6Keychain)）
      # *-mesa-dev/-dev 系列：find_package(Qt6 Gui→WrapOpenGL) 需要 GL 头与
      # libOpenGL/libGLX 开发链（run4 实测缺失）
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0 patchelf squashfs-tools file qtkeychain-qt6-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev

      - name: Cache Qt (linux_gcc_64) toolchain
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-linuxgcc64-qtpdf-v1

      - name: Install Qt (linux_gcc_64) via aqtinstall
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall
          # qtpdf: docs/20 §5.2 PDF 导入（QPdfDocument 文本提取），不在基础包里
          aqt install-qt linux desktop $QT_VERSION linux_gcc_64 -m qtpdf --outputdir $QT_DIR

      # NEXUS_LINUX_APPIMAGE=ON：install 规则额外挂载 Qt deploy 脚本，
      # deploy.sh 的 cmake --install 会把 Qt 运行时捆绑进 AppDir
      - name: Configure
        run: cmake -B build -G Ninja -DBUILD_TESTS=ON -DNEXUS_LINUX_APPIMAGE=ON -DCMAKE_PREFIX_PATH=$QT_DIR/$QT_VERSION/gcc_64

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Deploy (AppImage)
        run: ./scripts/deploy.sh -BuildDir build -OutDir deploy

      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-linux64-appimage
          path: NexusAI-*-linux64.AppImage
